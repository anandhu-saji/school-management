version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ghss_school_portal_app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/ghss_student_portal
      - JWT_SECRET=super_secret_school_portal_key_2026
      - JWT_EXPIRES_IN=7d
      - RAZORPAY_KEY_ID=rzp_test_schoolportal2026
      - RAZORPAY_KEY_SECRET=secret_schoolportal_key_2026
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:6.0
    container_name: ghss_school_portal_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
    driver: local
